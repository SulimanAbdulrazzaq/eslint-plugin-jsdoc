jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
    - uses: pnpm/action-setup@v4
      with:
        version: latest
    - name: setup repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: setup node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22.14.0
    - run: pnpm install
    - run: pnpm build
    - run: pnpm lint
    - run: pnpm create-docs
    - name: check that the generated files are up to date
      run: "if [ -n \"$(git status --porcelain)\" ]; then\n  git status --porcelain\n\
        \  git diff\n  echo '::error::Generated files are not up to date; run `pnpm\
        \ create-docs` and commit the result.'\n  exit 1\nfi\n"
    timeout-minutes: 10
name: check generated files (test)
'on':
  push:
    branches:
    - s20ci/**
